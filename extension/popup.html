<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizador Transcriptor</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 340px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1.25rem;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }
        .header-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        h1 { font-size: 1.05rem; font-weight: 700; }
        .subtitle { font-size: 0.75rem; color: var(--text-muted); }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.55rem 0.75rem;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); }
        .btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .auto-sync-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .auto-sync-info {
            font-size: 0.8rem;
        }
        .auto-sync-info span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(16px); }
        .status-box {
            margin-top: 1rem;
            padding: 0.65rem 0.75rem;
            border-radius: 6px;
            font-size: 0.78rem;
            display: none;
            line-height: 1.4;
        }
        .status-box.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }
        .status-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .footer-note {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">🔄</div>
        <div>
            <h1>Sync Cookies YouTube</h1>
            <p class="subtitle">Transcriptor de Predicaciones</p>
        </div>
    </div>

    <div class="form-group">
        <label for="server-url">URL del Servidor</label>
        <input type="text" id="server-url" value="https://descargasyoutube.grupocmg.digital" placeholder="https://descargasyoutube.grupocmg.digital">
    </div>

    <div class="form-group">
        <label for="sync-token">Clave de Seguridad (Sync Token)</label>
        <input type="password" id="sync-token" value="cmg-transcriptor-2026" placeholder="Token secreto">
    </div>

    <button id="btn-sync" class="btn">
        <span>🔄 Sincronizar Cookies Ahora</span>
    </button>

    <div class="auto-sync-card">
        <div class="auto-sync-info">
            <strong>Auto-Sync Activo</strong>
            <span>Cada 12 horas y al visitar YouTube</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="auto-sync-toggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div id="status-box" class="status-box"></div>

    <div class="footer-note">
        <span id="last-sync-time">Última sinc: Nunca</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
